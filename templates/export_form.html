{% extends "base.html" %}
{% block content %}
<h2>Skills Export</h2>
<form method="POST">
  <label>Skills auswählen:
    <select name="skills" id="export_skills" multiple>
      {% for s in skills %}
      <option value="{{ s.name }}">{{ s.name }}</option>
      {% endfor %}
    </select>
  </label>
  <br><br>
  <button type="submit" name="export_type" value="pdf">PDF exportieren</button>
  <button type="submit" name="export_type" value="docx">DOCX exportieren</button>
</form>

<script>
new Choices('#export_skills', { removeItemButton: true });
</script>
{% endblock %}
