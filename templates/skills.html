{% extends "base.html" %}
{% block content %}
<h1>Skills verwalten</h1>

<!-- Neues Skill hinzufügen -->
<form id="add-skill-form" method="POST" action="{{ url_for('skills_view') }}">
    <input type="text" name="name" placeholder="Skill Name (EN)" required>
    <input type="text" name="name_de" placeholder="Skill Name (DE, optional)">
    <label>Kategorie:
        <select name="category">
            <option value="">-- keine --</option>
            {% for cat in categories %}
            <option value="{{ cat.name }}">{{ cat.name }}</option>
            {% endfor %}
        </select>
    </label>
    <button type="submit">Skill hinzufügen</button>
</form>

<hr>

<table>
<tr><th>Skill (EN)</th><th>Skill (DE)</th><th>Kategorie</th><th>Aktion</th></tr>
{% for s in skills %}
<tr>
    <td><input type="text" value="{{ s.name }}" data-index="{{ loop.index0 }}" class="edit-skill-en"></td>
    <td><input type="text" value="{{ s.name_de }}" data-index="{{ loop.index0 }}" class="edit-skill-de"></td>
    <td>
        <select data-index="{{ loop.index0 }}" class="edit-skill-category">
            <option value="">-- keine --</option>
            {% for cat in categories %}
            <option value="{{ cat.name }}" {% if s.category == cat.name %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>
    </td>
    <td>
        <button type="button" onclick="deleteSkill({{ loop.index0 }})">Löschen</button>
    </td>
</tr>
{% endfor %}
</table>

<script>
// In-place Edit Name/DE
document.querySelectorAll('.edit-skill-en, .edit-skill-de').forEach(input => {
    input.addEventListener('change', function() {
        const index = this.dataset.index;
        const en = document.querySelector(`.edit-skill-en[data-index="${index}"]`).value;
        const de = document.querySelector(`.edit-skill-de[data-index="${index}"]`).value;
        const cat = document.querySelector(`.edit-skill-category[data-index="${index}"]`).value;

        fetch("/skills/edit", {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({index:index, name:en, name_de:de, category:cat})
        });
    });
});

// In-place Edit Kategorie
document.querySelectorAll('.edit-skill-category').forEach(select => {
    select.addEventListener('change', function() {
        const index = this.dataset.index;
        const en = document.querySelector(`.edit-skill-en[data-index="${index}"]`).value;
        const de = document.querySelector(`.edit-skill-de[data-index="${index}"]`).value;
        const cat = this.value;

        fetch("/skills/edit", {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({index:index, name:en, name_de:de, category:cat})
        });
    });
});

function deleteSkill(index) {
    if(confirm('Skill wirklich löschen?')) {
        fetch("/skills/delete", {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({index:index})
        }).then(() => location.reload());
    }
}
</script>
{% endblock %}
