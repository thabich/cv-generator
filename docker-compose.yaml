services:
  cvbuilder:
    build: .
    container_name: cvbuilder_app
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data   # Mount des Data-Verzeichnisses
      - ./app.py:/app/app.py
      - ./templates:/app/templates
      - ./static:/app/static
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
